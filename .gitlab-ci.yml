#
# GitLab CI for the 3D station calibration project.
# The default image provides Python 3.13 and uv.

stages:
  - test
  - build
  - check

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  before_script:
    # opencv-python needs these shared libraries even in headless jobs.
    - apt-get update
    - apt-get install -y --no-install-recommends
      libgl1 libglib2.0-0 libsm6 libxext6 libxrender1
    - uv --version

variables:
  # hatch-vcs needs the full history and tags to derive the CalVer version.
  GIT_DEPTH: "0"
  GIT_FETCH_EXTRA_FLAGS: "--tags"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: "copy"
  PYTHONUNBUFFERED: "1"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

test:
  stage: test
  script:
    - uv --version
    - uv sync --frozen
    - uv lock --check
    - uv run pytest -q --cov=station_calibration --cov-report=term-missing --cov-report=xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%$/'
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 week

lint:
  stage: test
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run mypy

test-ice:
  stage: test
  # Use the Debian system Python so the distro's zeroc-ice package is visible.
  image: debian:trixie-slim
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
      ca-certificates git gnupg python3 python3-pip python3-venv wget
      libgl1 libglib2.0-0t64 libsm6 libxext6 libxrender1
    - wget https://download.zeroc.com/ice/3.8/debian13/ice-repo-3.8_1.0.0_all.deb
      -O /tmp/ice-repo.deb
    - dpkg -i /tmp/ice-repo.deb
    - apt-get update
    - apt-get install -y --no-install-recommends python3-zeroc-ice
    - python3 -c "import Ice; print(Ice.stringVersion())"
  script:
    - python3 -m venv --system-site-packages .venv-ice
    - .venv-ice/bin/python -m pip install --upgrade pip
    - .venv-ice/bin/python -m pip install -e . pytest
    - .venv-ice/bin/python -m pytest -q tests/test_ice_adapter.py

build:
  stage: build
  script:
    - uv sync --frozen
    - rm -rf dist
    - uv build
    - uv pip install --no-deps --force-reinstall dist/*.whl
    - .venv/bin/python -c "from pathlib import Path; import station_calibration; assert (Path(station_calibration.__file__).parent / 'py.typed').is_file()"
    - .venv/bin/3dsc --version
    - .venv/bin/3dsc-ice-server --version
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

shell-syntax:
  stage: check
  before_script: []
  script:
    - bash -n deploy/linux/3dsc-update
    - python -m py_compile scripts/release.py scripts/generate_ice_stubs.py

powershell-syntax:
  stage: check
  image: mcr.microsoft.com/powershell:7.4-ubuntu-22.04
  before_script: []
  script:
    - pwsh -NoProfile -File scripts/check-powershell.ps1
