[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "3dstationcalibration"
dynamic = ["version"]
description = "Camera and robot calibration for phenoSeeder 3D stations"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Viktor Sydoruk", email = "v.sydoruk@fz-juelich.de" },
]
maintainers = [
    { name = "Viktor Sydoruk", email = "v.sydoruk@fz-juelich.de" },
]
keywords = [
    "calibration",
    "camera-calibration",
    "computer-vision",
    "phenoseeder",
    "robot",
    "zeroc-ice",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
ice = [
    "zeroc-ice>=3.8.3",
]
notebooks = [
    "ipykernel>=7.3.0",
]

[project.scripts]
3dsc = "station_calibration.cli:run_cli"
3dsc-ice-server = "station_calibration.ice.server:run_cli"
3dsc-ice-client = "station_calibration.ice.client:run_cli"

[project.urls]
Homepage = "https://gitlab.fz-juelich.de/ibg-2/phenoseeder/3d-station-calibration"
Repository = "https://gitlab.fz-juelich.de/ibg-2/phenoseeder/3d-station-calibration"
Documentation = "https://gitlab.fz-juelich.de/ibg-2/phenoseeder/3d-station-calibration/-/blob/main/docs/wiki/Home.md"
Changelog = "https://gitlab.fz-juelich.de/ibg-2/phenoseeder/3d-station-calibration/-/blob/main/CHANGELOG.md"
Issues = "https://gitlab.fz-juelich.de/ibg-2/phenoseeder/3d-station-calibration/-/issues"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "scipy-stubs~=1.18.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [
    # Generated by slice2py; keep it untouched so the stubs can be regenerated.
    "src/station_calibration/ice/generated",
]

[tool.ruff.lint]
# Start with the stable default rules. Import sorting and stricter rule sets are
# deliberately deferred to a dedicated cleanup pass so this baseline stays reviewable.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
# Preserve the existing quote style while formatting files touched from now on.
quote-style = "preserve"

[tool.mypy]
python_version = "3.13"
files = ["src/station_calibration"]
exclude = ["^src/station_calibration/ice/generated/"]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["station_calibration"]
omit = [
    "*/station_calibration/ice/generated/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Coverage floor; raise it as the remaining gaps close.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == [\"']__main__[\"']:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "calver-by-date"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/station_calibration"]

[tool.hatch.build.targets.sdist]
include = [
    "src/station_calibration",
    "scripts/generate_ice_stubs.py",
    "tests",
    "ice",
    "deploy",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
exclude = [
    # Maintainer-only release and CI helpers. The Ice stub generator is kept so
    # an unpacked sdist can regenerate stubs from the bundled contracts.
    "scripts/release.py",
    "scripts/check-powershell.ps1",
    # Historical compatibility shims retained in the repository for reference.
    "ice/*_test.ice",
]
