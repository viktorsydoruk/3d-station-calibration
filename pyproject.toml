[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "3dstationcalibration"
dynamic = ["version"]
description = "Camera and robot calibration for phenoSeeder 3D stations"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Viktor Sydoruk", email = "v.sydoruk@fz-juelich.de" },
]
maintainers = [
    { name = "Viktor Sydoruk", email = "v.sydoruk@fz-juelich.de" },
]
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
ice = [
    "zeroc-ice>=3.8.3",
]
notebooks = [
    "ipykernel>=7.3.0",
]

[project.scripts]
3dsc = "station_calibration.cli:run_cli"
3dsc-ice-server = "station_calibration.ice.server:run_cli"
3dsc-ice-client = "station_calibration.ice.client:run_cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scipy-stubs~=1.18.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
version_scheme = "calver-by-date"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/station_calibration"]

[tool.hatch.build.targets.sdist]
include = [
    "src/station_calibration",
    "tests",
    "scripts",
    "ice",
    "deploy",
    "docs",
    "_3dsc_resources/CalibrationPhenoseederIcing.ice",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
