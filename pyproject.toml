[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3dstationcalibration"
version = "0.1.0"
description = "Camera and robot calibration for phenoSeeder 3D stations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
    "zeroc-ice>=3.8.3",
]

[project.scripts]
3dsc = "station_calibration.cli:run_cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.hatch.build.targets.wheel]
packages = ["src/station_calibration"]

[tool.hatch.build.targets.sdist]
include = [
    "src/station_calibration",
    "tests",
    "README.md",
    "pyproject.toml",
]
