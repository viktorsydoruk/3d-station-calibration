# configuration to the 3D station calibration
[general]
# whether to show debug information and write reporting plots
debug = false
# whether to store debug images
store_debug_images = false
# whether the Ice server archives each session with images, robot positions,
# and the latest calibration result in the session's data folder
archive_sessions = true
# whether to load the data of previous analysis of images
load_stored_data = true
# absolute folder containing one subfolder per procedure for the Ice server;
# this is required by 3dsc-ice-server and ignored by the folder workflow
procedures_root = ""

[general.files]
# name of the file where the positions of robotic arm are stored
robot_pos_filename = "Calibration3DPositions.csv"
# folder name to store some output results (relative to main folder)
output_folder = "output"
# folder name to store debug information (relative to main folder)
debug_folder = "debug"
# name of the file where to store the found properties of spheres on the images
all_center_points_filename = "CalibrationAllPoints.dat"
# patterns of image files
image_name_patterns = ["*.tif", "*.tiff"]
# whether to sort images by last modification date
sort_image_names_by_mtime = true

[analysis]
# number of iterations to perform for camera calibrations (includes adjustments of center points and robotic arm home pos)
n_iterations = 3
# maximum allowed outliers (0 - not allowed outlier detection, < 1 - part of number of points, >=1 - allowed number of outliers
max_outliers = 10
# confidence level of the 2D chi-square outlier test; points above this
# threshold are candidate blunders
outlier_confidence = 0.999
# keep candidate outliers that form a tight spatial cluster; such a group is
# more likely a systematic robot or camera-model effect than a blunder
outlier_cluster_guard = true
# refit after this many new valid observations; 0 fits only on an explicit
# finish() call. Larger values reduce CPU use during long acquisitions.
fit_every_n = 5

[analysis.background]
# fixed threshold value for the background (0 estimation will be done automatically based on 2 next params
fixed_bg_threshold = 30
# number of rows (either from bottom or from top) where only background is located
bg_height_pxs = 200
# percentile of intensity values of previously defined image rows to estimate the background color
#       example, in case of 200 rows x 2000 pxs: 99.99% - 4000 pxs outliers (that might have too high intensities
#                                                99.999% - 400 pxs
#                                                99.9999% - 40 pxs
bg_color_est_perc = 99.999

[analysis.sphere_projection]
# number of values for moving avarage to smooth the data to estimate where the center of found sphere is located
n_move_aver = 11
# part of the sphere between its center and the nozzle that holds it to take into account to fit with circle
sphere_center_to_nozzle_part = 0.7
# minimum number pixels on edges of found sphere from each border of the image
min_bg_pixels_on_edges = 5
# border thickness of rings on edge of sphere to average to estimate bluring sigma
blur_est_border_thickness = 2

[analysis.fit]
# whether to fix principal point of the camera
fix_cx_cy = true
# number of distortion coefficients to be taken into account (can be 0, 4, 5, 8, 12, or 14)
n_distortion_coefs = 0
# initial focal length in pixels used for the first calibration fit
focal_length_initial = 2000.0
# initial camera distance in mm used for the first calibration fit
camera_distance_initial = 80.0
# soft_l1 transition scale in pixels; residual magnitudes above this are
# downweighted while ordinary reprojection errors stay near quadratic
loss_f_scale = 5.0
# use the per-image circle-fit centre covariance as measurement weights;
# caches written before covariance support existed fall back to an unweighted fit
center_weighting = true

[analysis.stop]
# minimum number of valid observations before saturation-based readiness is
# evaluated; more observations are accepted if the fit has not saturated yet
target_observations = 100
# optional safety cap; reaching it forces readiness with a forced flag
# max_observations = 600

[analysis.readiness]
# require the camera fit to stop changing materially before reporting ready;
# set to false to restore count-only readiness
enabled = true
# record a fit checkpoint after this many new valid observations
checkpoint_interval = 10
# compare the mean of the last N checkpoints with the previous N checkpoints
stable_checkpoints = 3
# minimum fraction of valid observations that must survive filtering
min_inlier_fraction = 0.9
# practical-change tolerances between the two checkpoint windows
focal_relative_tolerance = 0.001
principal_point_tolerance_px = 0.05
translation_tolerance_mm = 0.05
rotation_tolerance_deg = 0.01
home_tolerance_mm = 0.05
distortion_tolerance = 0.0001

[analysis.uncertainty]
# optional post-fit residual bootstrap for the nozzle-home uncertainty; this
# reruns the fit and writes a sidecar JSON report, but does not affect readiness
# or the stored calibration result
enabled = false
# number of bootstrap replicates
n_bootstrap = 500
# random seed; use the same seed to reproduce a report
seed = 0
# sidecar JSON file inside the output folder
report_filename = "nozzle_uncertainty.json"
